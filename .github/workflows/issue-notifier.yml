name: Help Wanted notifier

# Runs in YOUR OWN repo, reading the public Expensify/App event stream.
# Cron only starts the job; the job itself polls every 60s for ~14 minutes,
# because GitHub's scheduler is often 10-40 minutes late on free runners.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: help-wanted-notifier
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 16

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run notifier
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          REPO: Expensify/App
          LABEL: Help Wanted
          STATE_FILE: last_event.json
          RUN_ONCE: "false"
          POLL_INTERVAL_SECONDS: "60"
          MAX_RUNTIME_SECONDS: "840"
        run: python3 scripts/help_wanted_notifier.py

      - name: Persist state
        if: always()
        run: |
          if [[ -z "$(git status --porcelain last_event.json)" ]]; then
            echo "No state change."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_event.json
          git commit -m "Update last event id [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              exit 0
            fi
            sleep 5
          done
          echo "Could not push state." >&2
          exit 1
